plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'net.researchgate.release' version '3.2.0'
}

group = 'com.johnsonstuff'
// Note: (version) Recently Moved to 'net.researchgate.release' plugin

java {
	toolchain {
		// JDK26 has container issues right and left, no time to debug
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// This contains JUnit 5 (Jupiter), Assertions, and the Test Engine
	testImplementation 'org.springframework.boot:spring-boot-starter-test'	
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


// Ensure standard tasks like jar or publishing run during the release phase
afterReleaseBuild.dependsOn tasks.named('build') 

release {
    // Defines the prefix added before the version number in Git
    tagTemplate = 'release-${version}'

    failOnCommitNeeded = true          // Fails if you have uncommitted local files
    failOnPublishNeeded = true         // Fails if local artifacts haven't been built
    failOnSnapshotDependencies = true  // Crucial: ensures no -SNAPSHOT dependencies sneak into production
    failOnUnversionedFiles = true      // Fails if there are untracked files in Git
    
    // Automatically pushes tags and version bumps to your remote repository
    pushReleaseVersionBranch = 'main' 

    git {
        requireBranch.set('main')      // Restricts releases to your 'main' or 'master' branch
        pushToRemote.set('origin')     // The remote tracking branch
    }
}

tasks.register('notifyReleaseSuccess') {
    doLast {
        println "🎉 Release complete and pushed to remote!"
    }
}

// Hook notifyReleaseSuccess to run at the absolute end of the release task chain
tasks.named('release') {
    finalizedBy 'notifyReleaseSuccess'
}

tasks.named('test') {
	useJUnitPlatform()
}

